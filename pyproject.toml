[project]
name = "tapo-c225-monitor"
version = "1.0.3"
description = "Monitor de Bebé inteligente para TP-Link Tapo C225 con PySide6 y visión IA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "pytapo>=3.3.0",
    "ultralytics>=8.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "av>=10.0.0",
    "sounddevice>=0.5.0",
    "pystray>=0.19.5",
    "pyside6>=6.8.0",
    "matplotlib>=3.8.0",
    "onnxruntime>=1.16.0",
]

